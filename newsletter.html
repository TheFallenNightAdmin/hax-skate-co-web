<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsletter | HAX Skate Co.</title><meta name="description" content="HAX Skate Company makes skateboards for riders who care about how a board feels and the culture around it."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap"><a class="logo" href="/">HAX Skate Co.</a><details class="menu"><summary>Menu</summary><nav aria-label="Main"><a href="/">Home</a><a href="/boards">Boards</a><a href="/story">Story</a><a href="/out-there">Out There</a><a href="/newsletter" aria-current="page">Newsletter</a></nav></details></div></header><main><div class="hero small"><p class="sub">HAX Skate Company</p><h1>Drop List</h1></div><section><div class="wrap"><div class="frame"><p>New boards and event dates, sent only when something happens.</p>
<form id="f" action="https://formsubmit.co/ajax/pagonihaxco@yahoo.com" method="POST">
  <input id="e" name="email" type="email" required placeholder="you@example.com" autocomplete="email" aria-label="Email address">
  <input type="hidden" name="_subject" value="New HAX Skate Co. Drop List signup">
  <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
  <button class="btn" type="submit">Join the list</button>
</form>
<p id="msg" role="status"></p></div></div></section>
<script>
document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = this.querySelector("button");
  btn.disabled = true;
  msg.textContent = "Adding you...";
  try {
    const res = await fetch(this.action, {
      method: "POST",
      headers: { "Accept": "application/json" },
      body: new FormData(this)
    });
    if (!res.ok) throw new Error("Request failed");
    msg.textContent = "You are on the list: " + document.getElementById("e").value;
    this.reset();
  } catch (err) {
    msg.textContent = "Something went wrong. Try again in a moment.";
  } finally {
    btn.disabled = false;
  }
});
</script></main><footer><div class="wrap">HAX Skate Co. Built for the feeling.</div></footer></body></html>
